[package]
name = "klone"
version = "0.4.1"
edition = "2024"
description = "Archive and retrieve large media files to a Hetzner Storage Box"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
md-5 = "0.10"
parking_lot = "0.12"
anyhow = "1"
dirs = "6"
filetime = "0.2"
trash = "5"
libc = "0.2"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
