# Push a version tag (make release) → test, build a universal app, sign the
# update archive, and publish a GitHub release that installed copies of
# Klone pick up through the in-app updater.
#
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (contents of
# ~/.tauri/klone.key on the release manager's Mac).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history, for the release notes

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true

      - name: Install Tauri CLI
        run: cargo tauri --version 2>/dev/null || cargo install tauri-cli --version "^2" --locked

      - name: Tests
        run: cargo test

      - name: Build, sign and publish
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: scripts/release.sh publish
